name: AlMosafer CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore AlMosafer.slnx

    - name: Build Solution
      run: dotnet build AlMosafer.slnx --no-restore --configuration Release

    - name: Run Test Suite
      run: dotnet test tests/AlMosafer.Tests/AlMosafer.Tests.csproj --no-build --configuration Release --verbosity normal

    - name: Publish Artifact
      run: dotnet publish src/AlMosafer.Web/AlMosafer.Web.csproj --no-build --configuration Release --output ./publish
