<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>لا يوجد اتصال — منصة المسافر</title>
    <style>
        :root { color-scheme: dark; }
        body { font-family: Tahoma, Arial, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: radial-gradient(1200px 600px at 85% -10%, rgba(13,148,136,.25), transparent 60%), #0f172a; color: #e8ecf1; }
        .box { text-align: center; padding: 2rem; max-width: 430px; }
        .ring { width: 88px; height: 88px; margin: 0 auto 1.25rem; border-radius: 50%; display: flex; align-items: center; justify-content: center;
                background: rgba(13,148,136,.12); border: 1px solid rgba(45,212,191,.35); box-shadow: 0 0 0 10px rgba(13,148,136,.08); }
        h1 { font-size: 1.5rem; margin: 0 0 .5rem; font-weight: 800; }
        p { color: #9fb0c3; line-height: 1.9; margin: 0; }
        .hint { margin-top: .9rem; font-size: .85rem; color: #5eead4; }
        a { display: inline-flex; align-items: center; gap: .5rem; margin-top: 1.4rem; text-decoration: none; font-weight: 800;
            background: linear-gradient(135deg, #0d9488, #14b8a6); color: #fff; padding: .75rem 1.8rem; border-radius: 999px;
            box-shadow: 0 10px 24px rgba(13,148,136,.35); transition: transform .15s ease; }
        a:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="box">
        <div class="ring">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="2" x2="22" y1="2" y2="22"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/>
                <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><line x1="12" x2="12.01" y1="20" y2="20"/>
            </svg>
        </div>
        <h1>انقطع الاتصال مؤقتاً</h1>
        <p>تعذّر الوصول إلى المنصة الآن. حجوزاتك وبياناتك محفوظة بأمان — أعد المحاولة حين يعود الاتصال.</p>
        <p class="hint">جداول الخطوط العامة التي زرتها سابقاً قد تبقى متاحة للقراءة حتى بدون شبكة.</p>
        <a href="/">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
            إعادة المحاولة
        </a>
    </div>
</body>
</html>
